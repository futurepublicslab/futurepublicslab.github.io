  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F4F8FD; --ink: #222A3D; --muted: #56627A; --line: #DCE5F2; --empty: #A3ADBF; --idle: #E1E9F4; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131822; --ink: #E9EEF6; --muted: #A4ACBD; --line: #2C3444; --empty: #6A7286; --idle: #252D3B; color-scheme: dark; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--ink);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }
    [lang="en"] { font-family: "Plus Jakarta Sans", "Noto Sans KR", sans-serif; }
    main { max-width: 30rem; }
    .mark { width: 56px; height: 56px; display: block; margin: 0 0 24px -4px; }
    h1 { font-size: clamp(1.5rem, 8.2vw, 2.4rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 0; white-space: nowrap; }
    .ko { font-size: 1.15rem; font-weight: 500; margin: 12px 0 2px; }
    .affil { font-size: .9rem; color: var(--muted); margin: 0 0 28px; }
    .note { margin: 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); line-height: 1.75; font-size: .95rem; }
    .mark .dot { animation: fill-in .45s ease-out both; animation-delay: calc(.35s + var(--i) * .18s); }
    @keyframes fill-in { from { fill: var(--idle); } }
    @media (prefers-reduced-motion: reduce) { .mark .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle class="dot" style="--i:0" cx="33.00" cy="20.00" r="3.4" fill="#8574DE"/><circle class="dot" style="--i:1" cx="29.19" cy="29.19" r="3.4" fill="#7E82E2"/><circle class="dot" style="--i:2" cx="20.00" cy="33.00" r="3.4" fill="#7691E6"/><circle class="dot" style="--i:3" cx="10.81" cy="29.19" r="3.4" fill="#6F9FEA"/><circle class="dot" style="--i:4" cx="7.00" cy="20.00" r="3.4" fill="#68A8D2"/><circle class="dot" style="--i:5" cx="10.81" cy="10.81" r="3.4" fill="#62B2BB"/><circle class="dot" style="--i:6" cx="20.00" cy="7.00" r="3.4" fill="#5BBBA3"/><circle cx="29.19" cy="10.81" r="2.9" fill="none" stroke="var(--empty)" stroke-width="1.3"/></svg>
    <h1 lang="en">Future Publics Lab</h1>
    <p class="ko">미래공론장 연구실</p>
    <p class="affil">KAIST 문술미래전략대학원</p>
    <p class="note">웹사이트를 준비하고 있습니다.<br><span lang="en">Our website is coming soon.</span></p>
  </main>
</body>
</html>
